name: Typescript Library Starter

on: [push]

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  dependencies:
    name: 📦 Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

  lint:
    name: 🔬 Lint & Format
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: 🔬 Lint & Format
        run: pnpm run lint:check

  audit:
    name: 🛡️ Audit
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: 🛡️ Audit
        run: pnpm audit --audit-level=high

  spell:
    name: 🈸 Spellcheck
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: 🈸 Spellcheck
        run: pnpm run spell:check

  type:
    name: ʦ Typecheck
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: ʦ Typecheck
        run: pnpm run type:check

  test:
    name: ⚡ Tests
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: ⚡ Tests
        run: pnpm run test:coverage

  test-setup:
    name: ⚡ Setup tests
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: ⚡ Tests
        run: pnpm run test:setup

  build-and-release:
    name: 🚀 Build & release
    needs: [lint, audit, spell, type, test, test-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: 🔨 Build
        run: pnpm run build
      - name: 🚀 Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run semantic-release

      - name: 👀 Preview release
        id: pack
        if: github.ref != 'refs/heads/main'
        run: echo "TARBALL=$(pnpm pack)" >> $GITHUB_OUTPUT

      - name: 📦 Upload package
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.pack.outputs.TARBALL }}
